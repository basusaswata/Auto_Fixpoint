# Fixpoint (POC): one job, self-sufficient on a bare GitHub-hosted runner.
#
#   trigger with inputs
#   -> install tools (Python, Node, Claude Code)
#   -> pin branch, check out target, strip agent config
#   -> fetch + verify pinned skills from the skills repo
#   -> findings: ingest the report if given, otherwise AI scan (SAST: review skill,
#      SCA: skill inventory confirmed by OSV)
#   -> align, dedupe, triage, plan
#   -> fix + AI-verify every group, then install/build/test every patch
#   -> raise the PRs (mode=fix)
#   -> report (always)
name: fixpoint

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Target repository (org/name)
        required: true
      branch:
        description: Target branch
        required: true
        default: main
      mode:
        description: review = report only · fix = also raise PRs
        type: choice
        options: [review, fix]
        default: review
      sast_report:
        description: SAST report (https URL, or a path inside the target repo). Empty = AI scan
        required: false
        default: ""
      sast_format:
        description: SAST report format
        type: choice
        options: [auto, sarif]
        default: auto
      sca_report:
        description: SCA report (https URL, or a path inside the target repo). Empty = AI scan + OSV
        required: false
        default: ""
      sca_format:
        description: SCA report format
        type: choice
        options: [auto, snyk, osv, sarif]
        default: auto
      max_prs:
        description: Max PRs for this run (policy caps still apply)
        required: false
        default: ""
      dry_run:
        description: In fix mode, print the PRs instead of raising them
        type: boolean
        default: false
  repository_dispatch:
    types: [fixpoint-sweep]

permissions: {}

concurrency:
  group: fixpoint-${{ github.event.inputs.repo || github.event.client_payload.repo }}-${{ github.event.inputs.branch || github.event.client_payload.branch }}
  cancel-in-progress: false

jobs:
  fixpoint:
    name: review → fix → PR
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read   # only to check out this repo; the target repo is accessed with the App token
    env:
      PYTHONUNBUFFERED: "1"
      FIXPOINT_POLICY: policy/policy.yaml
      FIXPOINT_SKILLS_LOCK: skills.lock
      FIXPOINT_MODEL: ${{ vars.FIXPOINT_MODEL || 'claude-sonnet-5-5' }}
      CLAUDE_VERSION: ${{ vars.FIXPOINT_CLAUDE_VERSION || '2.1.212' }}
      W: work          # all stage outputs
      T: target        # target repo checkout
    steps:
      # ---------------------------------------------------------------- tools
      - name: Checkout Fixpoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install git, fixpoint CLI and Claude Code
        run: |
          command -v git >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq git; }
          python -m pip install --disable-pip-version-check -q .
          npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_VERSION}"
          git --version && fixpoint --help >/dev/null && claude --version
          echo "FIXPOINT_AGENT_HOME=${RUNNER_TEMP}/fixpoint-agent-home" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- inputs + target
      - name: Validate inputs
        id: inputs
        env:
          FP_REPO: ${{ github.event.inputs.repo || github.event.client_payload.repo }}
          FP_BRANCH: ${{ github.event.inputs.branch || github.event.client_payload.branch }}
          FP_MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode }}
          FP_SAST_REPORT: ${{ github.event.inputs.sast_report || github.event.client_payload.sast_report }}
          FP_SAST_FORMAT: ${{ github.event.inputs.sast_format || github.event.client_payload.sast_format }}
          FP_SCA_REPORT: ${{ github.event.inputs.sca_report || github.event.client_payload.sca_report }}
          FP_SCA_FORMAT: ${{ github.event.inputs.sca_format || github.event.client_payload.sca_format }}
          FP_MAX_PRS: ${{ github.event.inputs.max_prs || github.event.client_payload.max_prs }}
          FP_DRY_RUN: ${{ github.event.inputs.dry_run || github.event.client_payload.dry_run }}
          FP_ACTOR: ${{ github.event.client_payload.requested_by || github.triggering_actor || github.actor }}
        run: fixpoint inputs --out "$W/run.json"

      - name: App token for the target repo (checkout + dedupe; revoked before any build)
        id: read-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.FIXPOINT_APP_ID }}
          private-key: ${{ secrets.FIXPOINT_APP_KEY }}
          owner: ${{ steps.inputs.outputs.owner }}
          repositories: ${{ steps.inputs.outputs.name }}
          skip-token-revoke: true   # revoked explicitly below

      - name: Pin branch to a commit
        id: pin
        env:
          FIXPOINT_READ_TOKEN: ${{ steps.read-token.outputs.token }}
        run: fixpoint pin --run "$W/run.json"

      - name: Checkout target at the pinned commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.inputs.outputs.repo }}
          ref: ${{ steps.pin.outputs.sha }}
          token: ${{ steps.read-token.outputs.token }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Strip agent config from the target (untrusted input)
        run: fixpoint neutralise --repo-dir "$T" --baseline

      # ---------------------------------------------------------------- skills
      - name: Fetch pinned skills from the skills repo (hash verified)
        run: fixpoint skills install --home "$FIXPOINT_AGENT_HOME"

      # ---------------------------------------------------------------- findings
      - name: SAST - ingest report
        if: steps.inputs.outputs.sast_report != ''
        env:
          REPORT: ${{ steps.inputs.outputs.sast_report }}
          FORMAT: ${{ github.event.inputs.sast_format || github.event.client_payload.sast_format || 'auto' }}
        run: fixpoint ingest --kind sast --report "$REPORT" --format "$FORMAT" --base-dir "$T" --out "$W/sast.json"

      - name: SAST - AI scan (review skill)
        if: steps.inputs.outputs.sast_report == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.FIXPOINT_ANTHROPIC_API_KEY }}
        run: fixpoint discover --kind sast --repo-dir "$T" --run "$W/run.json" --out "$W/sast.json"

      - name: SCA - ingest report
        if: steps.inputs.outputs.sca_report != ''
        env:
          REPORT: ${{ steps.inputs.outputs.sca_report }}
          FORMAT: ${{ github.event.inputs.sca_format || github.event.client_payload.sca_format || 'auto' }}
        run: fixpoint ingest --kind sca --report "$REPORT" --format "$FORMAT" --base-dir "$T" --out "$W/sca.json"

      - name: SCA - AI inventory + OSV lookup
        if: steps.inputs.outputs.sca_report == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.FIXPOINT_ANTHROPIC_API_KEY }}
        run: fixpoint discover --kind sca --repo-dir "$T" --run "$W/run.json" --out "$W/sca.json"

      # ---------------------------------------------------------------- review
      - name: Align findings to the pinned commit
        run: fixpoint align --in "$W/sast.json" --in "$W/sca.json" --repo-dir "$T" --run "$W/run.json" --out "$W/aligned.json"

      - name: Dedupe against existing Fixpoint PRs
        env:
          FIXPOINT_READ_TOKEN: ${{ steps.read-token.outputs.token }}
        run: fixpoint dedupe --in "$W/aligned.json" --run "$W/run.json" --out "$W/deduped.json"

      - name: Revoke the checkout token
        if: always() && steps.read-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.read-token.outputs.token }}
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/installation/token" && echo "revoked"

      - name: Triage (AI)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.FIXPOINT_ANTHROPIC_API_KEY }}
        run: fixpoint triage --in "$W/deduped.json" --repo-dir "$T" --run "$W/run.json" --out "$W/findings.json"

      - name: Plan
        id: plan
        run: fixpoint plan --in "$W/findings.json" --run "$W/run.json" --out "$W/plan.json"

      # ---------------------------------------------------------------- fix (mode=fix only)
      - name: Fix + AI verify every group
        if: steps.plan.outputs.has_groups == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.FIXPOINT_ANTHROPIC_API_KEY }}
        run: fixpoint fix-all --plan "$W/plan.json" --findings "$W/findings.json" --repo-dir "$T" --run "$W/run.json" --out-dir "$W"

      - name: Detect target build toolchain
        id: tc
        if: steps.plan.outputs.has_groups == 'true'
        run: fixpoint toolchain --repo-dir "$T"

      - name: Toolchain - Node.js
        if: steps.tc.outputs.kind == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.tc.outputs.version_file == '' && '20' || '' }}
          node-version-file: ${{ steps.tc.outputs.version_file }}

      - name: Toolchain - Java
        if: steps.tc.outputs.kind == 'java'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ steps.tc.outputs.version_file == '' && (vars.FIXPOINT_JAVA_VERSION || '17') || '' }}
          java-version-file: ${{ steps.tc.outputs.version_file }}

      - name: Toolchain - Go
        if: steps.tc.outputs.kind == 'go'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ steps.tc.outputs.version_file }}
          cache: false

      - name: Toolchain - Python (repo pins a version)
        if: steps.tc.outputs.kind == 'python' && steps.tc.outputs.version_file != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ${{ steps.tc.outputs.version_file }}

      - name: Toolchain - Maven / corepack
        if: steps.tc.outputs.kind == 'node' || steps.tc.outputs.needs_maven == 'true'
        env:
          KIND: ${{ steps.tc.outputs.kind }}
          NEEDS_MAVEN: ${{ steps.tc.outputs.needs_maven }}
        run: |
          if [ "$KIND" = "node" ]; then corepack enable; fi
          if [ "$NEEDS_MAVEN" = "true" ] && ! command -v mvn >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq maven
          fi

      - name: Install, build and test every patch (no secrets in this step)
        if: steps.plan.outputs.has_groups == 'true'
        run: fixpoint build-all --plan "$W/plan.json" --findings "$W/findings.json" --repo-dir "$T" --run "$W/run.json" --out-dir "$W"

      - name: Bundle verified patches (re-check policy)
        if: steps.plan.outputs.has_groups == 'true'
        run: >
          fixpoint sign --signing none --plan "$W/plan.json" --findings "$W/findings.json"
          --fix-dir "$W/fix" --verdict-dir "$W/verdicts" --run "$W/run.json" --out-dir "$W/bundles"

      # ---------------------------------------------------------------- PRs
      - name: App token for publishing
        id: write-token
        if: steps.plan.outputs.has_groups == 'true'
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.FIXPOINT_APP_ID }}
          private-key: ${{ secrets.FIXPOINT_APP_KEY }}
          owner: ${{ steps.inputs.outputs.owner }}
          repositories: ${{ steps.inputs.outputs.name }}

      - name: Raise PRs (re-check policy + dedupe, commit via API)
        if: steps.plan.outputs.has_groups == 'true'
        env:
          FIXPOINT_WRITE_TOKEN: ${{ steps.write-token.outputs.token }}
          DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
        run: |
          args=(--bundles "$W/bundles" --run "$W/run.json" --out "$W/publish.json" --signing none --allow-unsigned)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          fixpoint publish "${args[@]}"

      # ---------------------------------------------------------------- report
      - name: Report
        if: always()
        run: >
          fixpoint report --findings "$W/findings.json" --plan "$W/plan.json" --fix-dir "$W/fix"
          --sign "$W/bundles/sign.json" --publish "$W/publish.json" --run "$W/run.json"
          --out-dir "$W/report" --job-summary

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixpoint-results
          path: work/
          if-no-files-found: ignore
          retention-days: 30
