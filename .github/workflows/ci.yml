name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --disable-pip-version-check -q -e '.[dev]'
      - name: Lint
        run: ruff check fixpoint tests evals
      - name: Unit tests (no network)
        run: python -m pytest
      - name: Policy and skills.lock load
        run: |
          python -c "from fixpoint.config import load_policy, load_skills_lock; load_policy('policy/policy.yaml'); load_skills_lock('skills.lock')"
