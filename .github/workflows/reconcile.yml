# Records outcomes of recently closed Fixpoint PRs (merged / rejected + reason)
# and exports rejected ones as eval cases. Read-only everywhere.
name: fixpoint-reconcile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      since_days:
        description: Look back this many days
        default: "7"

permissions: {}

concurrency:
  group: fixpoint-reconcile
  cancel-in-progress: false

jobs:
  repos:
    runs-on: ${{ fromJSON(vars.FIXPOINT_RUNNER || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Enrolled repos
        id: list
        run: |
          python -m pip install --disable-pip-version-check -q .
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from fixpoint.config import load_policy
          print("repos=" + json.dumps(load_policy("policy/policy.yaml").enrolled_repos, separators=(",", ":")))
          EOF

  record:
    needs: repos
    if: needs.repos.outputs.repos != '[]'
    runs-on: ${{ fromJSON(vars.FIXPOINT_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo: ${{ fromJSON(needs.repos.outputs.repos) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -q .
      - name: Split repo
        id: target
        env:
          REPO: ${{ matrix.repo }}
        run: |
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"
          echo "slug=${REPO//\//__}" >> "$GITHUB_OUTPUT"
      - name: App token (target repo only)
        id: token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.FIXPOINT_APP_ID }}
          private-key: ${{ secrets.FIXPOINT_APP_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
      - name: Record outcomes
        env:
          FIXPOINT_READ_TOKEN: ${{ steps.token.outputs.token }}
          FIXPOINT_METRICS_URL: ${{ vars.FIXPOINT_METRICS_URL }}
          FIXPOINT_METRICS_TOKEN: ${{ secrets.FIXPOINT_METRICS_TOKEN }}
          REPO: ${{ matrix.repo }}
          SINCE: ${{ github.event.inputs.since_days || '7' }}
        run: >
          fixpoint record --repo "$REPO" --since-days "$SINCE"
          --out work/outcomes.json --evals-out work/eval-cases.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outcomes-${{ steps.target.outputs.slug }}
          path: work/
          retention-days: 90
