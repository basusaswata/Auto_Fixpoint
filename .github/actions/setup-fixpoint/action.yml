name: setup-fixpoint
description: >
  Prepare a Fixpoint job: Python + the fixpoint CLI, optionally the agent runtime and the
  pinned skills, and a neutralised sandbox copy of the target repo - either checked out with a
  short-lived read-only App token (prepare job) or unpacked from the pinned archive (worker jobs,
  no token at all).

inputs:
  source:
    description: "checkout (read App token, pin, checkout) | archive (unpack work/source.tar) | none"
    required: true
  run-file:
    description: Path to run.json written by `fixpoint inputs`
    default: work/run.json
  repo-dir:
    description: Where the target repo goes
    default: target
  archive:
    description: (archive) path of the source tarball
    default: work/source.tar
  read-app-id:
    description: (checkout) read-only GitHub App id
    default: ""
  read-app-key:
    description: (checkout) read-only GitHub App private key
    default: ""
  owner:
    description: (checkout) target repo owner
    default: ""
  repo-name:
    description: (checkout) target repo name
    default: ""
  install-agent:
    description: Install Claude Code and the pinned skills (false for jobs that run no AI)
    default: "true"
  claude-version:
    description: Pinned @anthropic-ai/claude-code version
    default: "2.1.212"
  node-version:
    description: Node.js used to run Claude Code
    default: "20"
  toolchain:
    description: Install the target repo's build toolchain (verify-build job only)
    default: "false"
  java-version:
    description: (toolchain) JDK when the repo has no .java-version/.sdkmanrc/.tool-versions
    default: "17"

outputs:
  sha:
    description: Pinned commit SHA
    value: ${{ steps.pin.outputs.sha }}
  token:
    description: (checkout) read-only installation token, scoped to the target repo
    value: ${{ steps.token.outputs.token }}
  agent-home:
    description: Private HOME for the agent (holds ~/.claude/skills)
    value: ${{ steps.home.outputs.dir }}

runs:
  using: composite
  steps:
    # GitHub-hosted runners: assume nothing beyond the OS. Every tool below is installed here.
    - name: Base OS tools (git, tar, unzip)
      shell: bash
      run: |
        missing=()
        for t in git tar unzip; do command -v "$t" >/dev/null || missing+=("$t"); done
        if [ ${#missing[@]} -gt 0 ]; then
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "${missing[@]}"
        fi
        git --version

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"

    - name: Install fixpoint
      shell: bash
      run: python -m pip install --disable-pip-version-check -q "${GITHUB_ACTION_PATH}/../../.."

    - name: Agent home
      id: home
      shell: bash
      run: |
        dir="${RUNNER_TEMP}/fixpoint-agent-home"
        mkdir -p "$dir"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "FIXPOINT_AGENT_HOME=$dir" >> "$GITHUB_ENV"

    # --- target repo: checkout mode (prepare job only) --------------------------------
    - name: Read-only App token (target repo only)
      id: token
      if: inputs.source == 'checkout'
      uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
      with:
        app-id: ${{ inputs.read-app-id }}
        private-key: ${{ inputs.read-app-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repo-name }}

    - name: Pin branch to a commit
      id: pin
      if: inputs.source == 'checkout'
      shell: bash
      env:
        FIXPOINT_READ_TOKEN: ${{ steps.token.outputs.token }}
        RUN_FILE: ${{ inputs.run-file }}
      run: fixpoint pin --run "$RUN_FILE"

    - name: Checkout target at the pinned commit
      if: inputs.source == 'checkout'
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: ${{ inputs.owner }}/${{ inputs.repo-name }}
        ref: ${{ steps.pin.outputs.sha }}
        token: ${{ steps.token.outputs.token }}
        path: ${{ inputs.repo-dir }}
        persist-credentials: false
        fetch-depth: 1

    - name: Archive the pinned tree for worker jobs
      if: inputs.source == 'checkout'
      shell: bash
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
        ARCHIVE: ${{ inputs.archive }}
        SHA: ${{ steps.pin.outputs.sha }}
      run: fixpoint worktree archive --repo-dir "$REPO_DIR" --sha "$SHA" --tar "$ARCHIVE"

    - name: Neutralise agent config in the target
      if: inputs.source == 'checkout'
      shell: bash
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
      run: fixpoint neutralise --repo-dir "$REPO_DIR" --baseline

    # --- target repo: archive mode (workers; no token exists in these jobs) --------------
    - name: Unpack pinned tree into a neutralised sandbox
      if: inputs.source == 'archive'
      shell: bash
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
        ARCHIVE: ${{ inputs.archive }}
      run: fixpoint worktree unpack --repo-dir "$REPO_DIR" --tar "$ARCHIVE"

    # --- agent runtime + skills ----------------------------------------------------------------
    - name: Node.js for Claude Code
      if: inputs.install-agent == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Claude Code (pinned)
      if: inputs.install-agent == 'true'
      shell: bash
      env:
        CLAUDE_VERSION: ${{ inputs.claude-version }}
      run: |
        npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_VERSION}"
        claude --version

    - name: Install pinned skills (checksum verified)
      if: inputs.install-agent == 'true'
      shell: bash
      run: fixpoint skills install --home "$FIXPOINT_AGENT_HOME"

    # --- target build toolchain (verify-build only; no secrets exist in that job) -------------
    - name: Detect build toolchain
      id: tc
      if: inputs.toolchain == 'true'
      shell: bash
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
      run: fixpoint toolchain --repo-dir "$REPO_DIR"

    - name: Node.js toolchain
      if: inputs.toolchain == 'true' && steps.tc.outputs.kind == 'node'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ steps.tc.outputs.version_file == '' && '20' || '' }}
        node-version-file: ${{ steps.tc.outputs.version_file }}

    - name: Enable corepack (yarn / pnpm)
      if: inputs.toolchain == 'true' && steps.tc.outputs.kind == 'node'
      shell: bash
      run: corepack enable

    - name: Java toolchain
      if: inputs.toolchain == 'true' && steps.tc.outputs.kind == 'java'
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: temurin
        java-version: ${{ steps.tc.outputs.version_file == '' && inputs.java-version || '' }}
        java-version-file: ${{ steps.tc.outputs.version_file }}

    - name: Maven (repo has no ./mvnw)
      if: inputs.toolchain == 'true' && steps.tc.outputs.needs_maven == 'true'
      shell: bash
      run: |
        command -v mvn >/dev/null || {
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends maven
        }
        mvn -v

    - name: Go toolchain
      if: inputs.toolchain == 'true' && steps.tc.outputs.kind == 'go'
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: ${{ steps.tc.outputs.version_file }}
        cache: false   # never let target code write to this repo's Actions cache

    - name: Python toolchain (repo pins a version)
      if: inputs.toolchain == 'true' && steps.tc.outputs.kind == 'python' && steps.tc.outputs.version_file != ''
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version-file: ${{ steps.tc.outputs.version_file }}
